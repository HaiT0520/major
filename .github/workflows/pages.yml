name: Publish Major dashboard

on:
  push:
    branches: [main]
    paths-ignore: ['.github/**']
  workflow_dispatch:

permissions: {}

concurrency:
  group: major-pages
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Collect public dashboard files
        run: |
          test -s index.html && test -s data/stages.json
          mkdir -p "$RUNNER_TEMP/major-site"
          rsync -r --exclude='.*' -- index.html *.css *.js assets data "$RUNNER_TEMP/major-site/"
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ${{ runner.temp }}/major-site

  deploy:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - id: publish
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
